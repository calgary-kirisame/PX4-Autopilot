name: Build FMUv5 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - uxrce-v1.16.2-fix

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install PX4 build dependencies
        run: ./Tools/setup/ubuntu.sh --no-sim-tools

      - name: Build FMUv5 firmware
        run: make px4_fmu-v5_default

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: px4_fmu-v5-default
          path: build/px4_fmu-v5_default/px4_fmu-v5_default.px4
          if-no-files-found: error
